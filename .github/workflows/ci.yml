name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      # Required release gate (docs/security.md): contact fields must be absent from
      # every pre-match response. Runs the golden-rule suites explicitly so the gate
      # is a distinct, named CI check — not merely part of the wider test run.
      - name: Golden-rule gate (contact hidden until match)
        run: npx vitest run -t "golden"

      - name: Test
        run: npm run test:ci

      # Dependency advisories on production deps block on high/critical (A06).
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
        env:
          # Build must succeed without real secrets. Sentry source-map upload is
          # skipped when SENTRY_AUTH_TOKEN is absent.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
